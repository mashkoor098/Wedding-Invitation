<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Central Emblem / Lotus -->
  <g transform="translate(400, 100)" filter="url(#goldGlow)">
    <circle cx="0" cy="0" r="28" stroke="url(#goldLinear)" stroke-width="1.5" fill="none" opacity="0.8"/>
    <circle cx="0" cy="0" r="22" stroke="url(#goldLinear)" stroke-width="1" stroke-dasharray="2,3" fill="none"/>
    <circle cx="0" cy="0" r="14" fill="url(#goldLinear)" opacity="0.3"/>
    <circle cx="0" cy="0" r="5" fill="url(#goldLinear)"/>
    
    <!-- Petals -->
    <path d="M0,-24 Q-8,-12 0,0 Q8,-12 0,-24 Z" fill="url(#goldLinear)" opacity="0.85"/>
    <path d="M0,24 Q-8,12 0,0 Q8,12 0,24 Z" fill="url(#goldLinear)" opacity="0.85"/>
    <path d="M-24,0 Q-12,-8 0,0 Q-12,8 -24,0 Z" fill="url(#goldLinear)" opacity="0.85"/>
    <path d="M24,0 Q12,-8 0,0 Q12,8 24,0 Z" fill="url(#goldLinear)" opacity="0.85"/>
    
    <path d="M-17,-17 Q-8,-17 0,0 Q-17,-8 -17,-17 Z" fill="url(#goldLinear)" opacity="0.65"/>
    <path d="M17,-17 Q8,-17 0,0 Q17,-8 17,-17 Z" fill="url(#goldLinear)" opacity="0.65"/>
    <path d="M-17,17 Q-8,17 0,0 Q-17,8 -17,17 Z" fill="url(#goldLinear)" opacity="0.65"/>
    <path d="M17,17 Q8,17 0,0 Q17,8 17,17 Z" fill="url(#goldLinear)" opacity="0.65"/>
  </g>

  <!-- Left Flourish -->
  <path d="M360,100 C320,100 280,85 240,85 C190,85 140,110 80,100 C50,95 20,100 0,100" stroke="url(#goldLinear)" stroke-width="1.75" fill="none"/>
  <path d="M350,105 C310,105 275,92 235,92 C185,92 135,115 85,105" stroke="url(#goldLinear)" stroke-width="0.75" stroke-dasharray="3,3" fill="none"/>
  <circle cx="240" cy="85" r="3.5" fill="url(#goldLinear)"/>
  <circle cx="160" cy="100" r="2.5" fill="url(#goldLinear)"/>
  <circle cx="80" cy="100" r="2" fill="url(#goldLinear)"/>
  <path d="M240,85 C235,70 215,65 205,75 C220,78 230,83 240,85 Z" fill="url(#goldLinear)" opacity="0.75"/>
  <path d="M160,100 C155,85 135,80 125,90 C140,93 150,98 160,100 Z" fill="url(#goldLinear)" opacity="0.75"/>

  <!-- Right Flourish (Symmetric) -->
  <path d="M440,100 C480,100 520,85 560,85 C610,85 660,110 720,100 C750,95 780,100 800,100" stroke="url(#goldLinear)" stroke-width="1.75" fill="none"/>
  <path d="M450,105 C490,105 525,92 565,92 C615,92 665,115 715,105" stroke="url(#goldLinear)" stroke-width="0.75" stroke-dasharray="3,3" fill="none"/>
  <circle cx="560" cy="85" r="3.5" fill="url(#goldLinear)"/>
  <circle cx="640" cy="100" r="2.5" fill="url(#goldLinear)"/>
  <circle cx="720" cy="100" r="2" fill="url(#goldLinear)"/>
  <path d="M560,85 C565,70 585,65 595,75 C580,78 570,83 560,85 Z" fill="url(#goldLinear)" opacity="0.75"/>
  <path d="M640,100 C645,85 665,80 675,90 C660,93 650,98 640,100 Z" fill="url(#goldLinear)" opacity="0.75"/>
</svg>
