<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="archGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="75%" stop-color="#FDF0A6" />
      <stop offset="100%" stop-color="#8B5A10" />
    </linearGradient>

    <!-- Off-White / Ivory Marble Gradient -->
    <linearGradient id="ivoryArch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#F5EFE6" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#EAE0D0" stop-opacity="0.92" />
    </linearGradient>

    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#D4AF37" flood-opacity="0.6"/>
    </filter>
    <filter id="lanternGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFF0A0" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Grand Islamic Mughal Multifoil Outer Arch Portal -->
  <path d="M 80 800 
           L 80 340 
           C 80 200, 240 120, 420 80 
           C 490 65, 560 40, 600 20 
           C 640 40, 710 65, 780 80 
           C 960 120, 1120 200, 1120 340 
           L 1120 800" 
        stroke="url(#archGold)" stroke-width="7" fill="none" filter="url(#goldShine)"/>

  <!-- Inner Scalloped Multifoil (Ogee) Cusped Arch -->
  <path d="M 140 800 
           L 140 380 
           C 140 310, 220 260, 290 240 
           C 360 220, 420 180, 480 140 
           C 540 100, 580 60, 600 45 
           C 620 60, 660 100, 720 140 
           C 780 180, 840 220, 910 240 
           C 980 260, 1060 310, 1060 380 
           L 1060 800" 
        stroke="url(#archGold)" stroke-width="4" stroke-dasharray="8,4" fill="none"/>

  <!-- Third Micro-Cusped Lace Line -->
  <path d="M 180 800 
           L 180 410 
           C 180 350, 260 300, 330 280 
           C 400 260, 460 210, 510 175 
           C 560 140, 590 100, 600 85 
           C 610 100, 640 140, 690 175 
           C 740 210, 800 260, 870 280 
           C 940 300, 1020 350, 1020 410 
           L 1020 800" 
        stroke="url(#archGold)" stroke-width="2" stroke-opacity="0.75" fill="none"/>

  <!-- Top Apex Islamic Crescent & Star Finial -->
  <g transform="translate(600, 32)" filter="url(#goldShine)">
    <!-- Crescent Moon -->
    <path d="M 0 -22 A 16 16 0 1 0 14 0 A 13 13 0 1 1 0 -22 Z" fill="url(#archGold)"/>
    <!-- 8-Point Islamic Star -->
    <polygon points="6,-10 8,-5 13,-5 9,-1 11,4 6,1 1,4 3,-1 -1,-5 4,-5" fill="#FFF3B0"/>
    <circle cx="0" cy="16" r="5" fill="url(#archGold)"/>
  </g>

  <!-- Left Hanging Royal Islamic Fanoos / Lantern -->
  <g transform="translate(230, 260)">
    <!-- Hanging Chain with Gold Links -->
    <line x1="0" y1="-160" x2="0" y2="0" stroke="url(#archGold)" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="0" cy="0" r="8" fill="url(#archGold)"/>
    
    <!-- Lantern Dome -->
    <path d="M -18 10 C -18 0, 18 0, 18 10 L 22 20 L -22 20 Z" fill="url(#archGold)"/>
    <!-- Glass Body with Candle Glow -->
    <polygon points="-22,20 22,20 16,65 -16,65" fill="#081C15" stroke="url(#archGold)" stroke-width="2"/>
    <polygon points="-16,24 16,24 11,60 -11,60" fill="url(#archGold)" opacity="0.25"/>
    <circle cx="0" cy="42" r="10" fill="#FFF3B0" filter="url(#lanternGlow)"/>
    <circle cx="0" cy="42" r="5" fill="#FFF" />
    <!-- Islamic Lattice Overlay on Lantern -->
    <line x1="-16" y1="42" x2="16" y2="42" stroke="url(#archGold)" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="0" y2="65" stroke="url(#archGold)" stroke-width="1.5"/>
    <!-- Bottom Finial & Hanging Tassel -->
    <polygon points="-16,65 16,65 0,80" fill="url(#archGold)"/>
    <circle cx="0" cy="88" r="4" fill="url(#archGold)"/>
    <line x1="0" y1="92" x2="0" y2="115" stroke="url(#archGold)" stroke-width="2"/>
    <circle cx="0" cy="118" r="3" fill="#FFF3B0"/>
  </g>

  <!-- Right Hanging Royal Islamic Fanoos / Lantern -->
  <g transform="translate(970, 260)">
    <!-- Hanging Chain with Gold Links -->
    <line x1="0" y1="-160" x2="0" y2="0" stroke="url(#archGold)" stroke-width="2.5" stroke-dasharray="6,3"/>
    <circle cx="0" cy="0" r="8" fill="url(#archGold)"/>
    
    <!-- Lantern Dome -->
    <path d="M -18 10 C -18 0, 18 0, 18 10 L 22 20 L -22 20 Z" fill="url(#archGold)"/>
    <!-- Glass Body with Candle Glow -->
    <polygon points="-22,20 22,20 16,65 -16,65" fill="#081C15" stroke="url(#archGold)" stroke-width="2"/>
    <polygon points="-16,24 16,24 11,60 -11,60" fill="url(#archGold)" opacity="0.25"/>
    <circle cx="0" cy="42" r="10" fill="#FFF3B0" filter="url(#lanternGlow)"/>
    <circle cx="0" cy="42" r="5" fill="#FFF" />
    <!-- Islamic Lattice Overlay on Lantern -->
    <line x1="-16" y1="42" x2="16" y2="42" stroke="url(#archGold)" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="0" y2="65" stroke="url(#archGold)" stroke-width="1.5"/>
    <!-- Bottom Finial & Hanging Tassel -->
    <polygon points="-16,65 16,65 0,80" fill="url(#archGold)"/>
    <circle cx="0" cy="88" r="4" fill="url(#archGold)"/>
    <line x1="0" y1="92" x2="0" y2="115" stroke="url(#archGold)" stroke-width="2"/>
    <circle cx="0" cy="118" r="3" fill="#FFF3B0"/>
  </g>
</svg>
