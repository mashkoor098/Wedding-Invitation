<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="crestGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#crestGlow)">
    <!-- Outer Octagonal / Scalloped Sacred Shield -->
    <circle cx="150" cy="150" r="135" stroke="url(#crestGold)" stroke-width="2" fill="none" opacity="0.4"/>
    <circle cx="150" cy="150" r="125" stroke="url(#crestGold)" stroke-width="4" fill="#081C15"/>
    <circle cx="150" cy="150" r="115" stroke="url(#crestGold)" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

    <!-- Royal Crown at Top -->
    <g transform="translate(150, 48)">
      <path d="M-30,12 L-36,-10 L-18,-2 L0,-16 L18,-2 L36,-10 L30,12 Z" fill="url(#crestGold)"/>
      <circle cx="-36" cy="-12" r="3" fill="#FFF3B0"/>
      <circle cx="0" cy="-18" r="4" fill="#FFF3B0"/>
      <circle cx="36" cy="-12" r="3" fill="#FFF3B0"/>
    </g>

    <!-- Intricate Floral Filigree inside Shield -->
    <path d="M 60,150 C 60,100 100,60 150,60 C 200,60 240,100 240,150 C 240,200 200,240 150,240 C 100,240 60,200 60,150 Z" stroke="url(#crestGold)" stroke-width="1.5" opacity="0.6"/>

    <!-- Center Monogram 'F & A' -->
    <text x="150" y="166" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="42" font-weight="700" fill="url(#crestGold)" text-anchor="middle" letter-spacing="3">F &amp; A</text>
    <text x="150" y="195" font-family="'Montserrat', sans-serif" font-size="10" font-weight="600" fill="#E5C158" text-anchor="middle" letter-spacing="5">EST. 2027</text>
  </g>
</svg>
