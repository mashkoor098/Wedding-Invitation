<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 900" fill="none">
  <defs>
    <!-- Royal Ivory & Off-White Marble Gradient -->
    <linearGradient id="ivoryMarble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="30%" stop-color="#F5EFE6" />
      <stop offset="70%" stop-color="#EDE4D5" />
      <stop offset="100%" stop-color="#E2D4BF" />
    </linearGradient>

    <!-- Deep Emerald Inlay Gradient -->
    <linearGradient id="emeraldInlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3326" />
      <stop offset="50%" stop-color="#081C15" />
      <stop offset="100%" stop-color="#040E0B" />
    </linearGradient>

    <!-- 24K Royal Gold Foil Gradient -->
    <linearGradient id="doorGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="75%" stop-color="#FDF0A6" />
      <stop offset="100%" stop-color="#8B5A10" />
    </linearGradient>

    <!-- Authentic Islamic 8-Point Star Girih / Mashrabiya Pattern -->
    <pattern id="islamicStarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#081C15"/>
      <!-- 8-Point Star Geometry -->
      <polygon points="20,4 24,14 34,14 26,20 29,30 20,24 11,30 14,20 6,14 16,14" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.6"/>
      <polygon points="20,8 23,15 30,15 25,19 27,26 20,22 13,26 15,19 10,15 17,15" fill="#D4AF37" opacity="0.25"/>
      <circle cx="20" cy="20" r="1.5" fill="#FFF3B0"/>
      <!-- Diagonal connecting lattice -->
      <line x1="0" y1="0" x2="40" y2="40" stroke="#D4AF37" stroke-width="0.75" opacity="0.4"/>
      <line x1="40" y1="0" x2="0" y2="40" stroke="#D4AF37" stroke-width="0.75" opacity="0.4"/>
    </pattern>

    <filter id="royalShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Door Main Base (Royal Ivory / Off-White Carved Stone) -->
  <rect x="0" y="0" width="400" height="900" fill="url(#ivoryMarble)" />

  <!-- Outer Architectural Border with Gold Filigree Inlay -->
  <rect x="14" y="14" width="372" height="872" rx="4" stroke="url(#doorGold)" stroke-width="5" fill="none"/>
  <rect x="24" y="24" width="352" height="852" stroke="#081C15" stroke-width="2" fill="none"/>
  <rect x="30" y="30" width="340" height="840" stroke="url(#doorGold)" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>

  <!-- ================= TOP PANEL: Authentic Mughal Ogee / Multifoil Arch ================= -->
  <g transform="translate(42, 45)">
    <!-- Arch Frame Container -->
    <rect width="316" height="230" rx="4" fill="url(#emeraldInlay)" stroke="url(#doorGold)" stroke-width="3.5" filter="url(#royalShadow)"/>
    <rect width="316" height="230" fill="url(#islamicStarGrid)" opacity="0.95"/>

    <!-- Multifoil Islamic Arch Carving -->
    <path d="M 20 220 
             L 20 120 
             C 20 90, 50 70, 80 65 
             C 105 60, 125 45, 140 30 
             C 150 20, 155 10, 158 5 
             C 161 10, 166 20, 176 30 
             C 191 45, 211 60, 236 65 
             C 266 70, 296 90, 296 120 
             L 296 220" 
          stroke="url(#doorGold)" stroke-width="3.5" fill="none" filter="url(#goldGlow)"/>

    <!-- Inner Cusped Scallops -->
    <path d="M 35 220 
             C 35 150, 65 110, 100 95 
             C 125 85, 145 65, 158 40 
             C 171 65, 191 85, 216 95 
             C 251 110, 281 150, 281 220" 
          stroke="url(#doorGold)" stroke-width="1.8" stroke-dasharray="4,3" fill="none"/>

    <!-- Crescent Moon & Islamic Star Finial at Apex -->
    <g transform="translate(158, 65)" filter="url(#goldGlow)">
      <!-- Crescent -->
      <path d="M 0 -22 A 14 14 0 1 0 12 -2 A 11 11 0 1 1 0 -22 Z" fill="url(#doorGold)"/>
      <!-- Star -->
      <polygon points="5,-11 7,-7 11,-7 8,-4 9,0 5,-2 1,0 2,-4 -1,-7 3,-7" fill="#FFF3B0"/>
    </g>

    <!-- Arabesque Floral Vines on Left/Right Spandrels -->
    <path d="M 30 50 Q 70 30 90 70 T 50 110" stroke="url(#doorGold)" stroke-width="1.5" fill="none" opacity="0.8"/>
    <path d="M 286 50 Q 246 30 226 70 T 266 110" stroke="url(#doorGold)" stroke-width="1.5" fill="none" opacity="0.8"/>
  </g>

  <!-- ================= MIDDLE PANEL: Royal Islamic Heritage Darwaza Portal ================= -->
  <g transform="translate(42, 295)">
    <rect width="316" height="320" rx="4" fill="url(#emeraldInlay)" stroke="url(#doorGold)" stroke-width="3.5" filter="url(#royalShadow)"/>
    <rect width="316" height="320" fill="url(#islamicStarGrid)" opacity="0.95"/>

    <!-- Inner Decorative Molded Frame -->
    <rect x="15" y="15" width="286" height="290" rx="4" stroke="url(#doorGold)" stroke-width="1.5" fill="none"/>

    <!-- Central Grand Islamic 12-Point Medallion (Shamsa) -->
    <g transform="translate(158, 160)" filter="url(#royalShadow)">
      <!-- Outer Sunburst Rays (Shamsa) -->
      <circle cx="0" cy="0" r="75" stroke="url(#doorGold)" stroke-width="2" fill="#081C15" opacity="0.9"/>
      <circle cx="0" cy="0" r="70" stroke="url(#doorGold)" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
      
      <!-- 8-Point Star Starburst Outer -->
      <polygon points="0,-65 18,-45 46,-46 45,-18 65,0 45,18 46,46 18,45 0,65 -18,45 -46,46 -45,18 -65,0 -45,-18 -46,-46 -18,-45" 
               fill="url(#doorGold)" opacity="0.35" stroke="url(#doorGold)" stroke-width="1.5"/>

      <!-- Inner Star Layer -->
      <polygon points="0,-48 13,-34 34,-34 34,-13 48,0 34,13 34,34 13,34 0,48 -13,34 -34,34 -34,13 -48,0 -34,-13 -34,-34 -13,-34" 
               fill="#0E3326" stroke="url(#doorGold)" stroke-width="2"/>

      <!-- Center Gold Rosette -->
      <circle cx="0" cy="0" r="22" fill="url(#doorGold)" filter="url(#goldGlow)"/>
      <circle cx="0" cy="0" r="16" fill="#081C15" stroke="url(#doorGold)" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="url(#doorGold)"/>
      <circle cx="0" cy="0" r="3" fill="#FFF3B0"/>

      <!-- Arabesque Petals -->
      <path d="M 0 -48 Q 12 -30 0 -12 Q -12 -30 0 -48 Z" fill="url(#doorGold)" opacity="0.7"/>
      <path d="M 0 48 Q 12 30 0 12 Q -12 30 0 48 Z" fill="url(#doorGold)" opacity="0.7"/>
      <path d="M -48 0 Q -30 12 -12 0 Q -30 -12 -48 0 Z" fill="url(#doorGold)" opacity="0.7"/>
      <path d="M 48 0 Q 30 12 12 0 Q 30 -12 48 0 Z" fill="url(#doorGold)" opacity="0.7"/>
    </g>

    <!-- Corner Islamic Arabesque Brackets -->
    <g stroke="url(#doorGold)" stroke-width="1.5" fill="none">
      <path d="M 22 45 Q 45 45 45 22"/>
      <circle cx="45" cy="45" r="3" fill="url(#doorGold)"/>
      <path d="M 294 45 Q 271 45 271 22"/>
      <circle cx="271" cy="45" r="3" fill="url(#doorGold)"/>
      <path d="M 22 275 Q 45 275 45 298"/>
      <circle cx="45" cy="275" r="3" fill="url(#doorGold)"/>
      <path d="M 294 275 Q 271 275 271 298"/>
      <circle cx="271" cy="275" r="3" fill="url(#doorGold)"/>
    </g>
  </g>

  <!-- ================= BOTTOM PANEL: Geometric Heritage Jali Base ================= -->
  <g transform="translate(42, 635)">
    <rect width="316" height="210" rx="4" fill="url(#emeraldInlay)" stroke="url(#doorGold)" stroke-width="3.5" filter="url(#royalShadow)"/>
    <rect width="316" height="210" fill="url(#islamicStarGrid)" opacity="0.95"/>

    <!-- Bottom Moorish Pointed Arch Inlay -->
    <path d="M 40 190 L 40 90 Q 158 20 276 90 L 276 190 Z" stroke="url(#doorGold)" stroke-width="2" fill="#081C15" opacity="0.6"/>
    <path d="M 60 190 L 60 110 Q 158 50 256 110 L 256 190" stroke="url(#doorGold)" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
    
    <!-- Central Rosette -->
    <circle cx="158" cy="115" r="28" stroke="url(#doorGold)" stroke-width="2" fill="url(#emeraldInlay)"/>
    <polygon points="158,95 163,108 178,108 166,117 170,131 158,122 146,131 150,117 138,108 153,108" fill="url(#doorGold)"/>
    <circle cx="158" cy="115" r="5" fill="#FFF3B0"/>
  </g>

  <!-- ================= ROYAL GOLD STUDS (ALHAMBRA / MUGHAL BRASS ACCENTS) ================= -->
  <g fill="url(#doorGold)" filter="url(#royalShadow)">
    <!-- Left Border Studs -->
    <circle cx="28" cy="80" r="6"/>
    <circle cx="28" cy="180" r="6"/>
    <circle cx="28" cy="280" r="6"/>
    <circle cx="28" cy="380" r="6"/>
    <circle cx="28" cy="480" r="6"/>
    <circle cx="28" cy="580" r="6"/>
    <circle cx="28" cy="680" r="6"/>
    <circle cx="28" cy="780" r="6"/>

    <!-- Right Border Studs -->
    <circle cx="372" cy="80" r="6"/>
    <circle cx="372" cy="180" r="6"/>
    <circle cx="372" cy="280" r="6"/>
    <circle cx="372" cy="380" r="6"/>
    <circle cx="372" cy="480" r="6"/>
    <circle cx="372" cy="580" r="6"/>
    <circle cx="372" cy="680" r="6"/>
    <circle cx="372" cy="780" r="6"/>
  </g>
</svg>
